services:
  job-finder:
    build: .
    image: job-finder:latest
    container_name: job-finder
    restart: unless-stopped
    env_file: .env
    volumes:
      # Edit config/*.yaml on the VM — changes apply on the next hourly run, no rebuild.
      - ./config:/app/config:ro
      # Remembers which jobs were already emailed. Survives restarts and rebuilds.
      - job-finder-data:/app/data
    # Keep logs from filling the VM disk.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    mem_limit: 256m

volumes:
  job-finder-data:
