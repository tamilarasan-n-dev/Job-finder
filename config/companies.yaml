# Company job boards to scan. Seeded from the Notion pages
# "Job Search Pipeline — SWE / Backend / AI Engineer (India + Remote)" and
# "Fresh Jobs — 24h Scan (2026-09-17)".
#
# ats: greenhouse | lever | ashby | smartrecruiters | workable
# slug: the board id in the company's job URL, e.g.
#   job-boards.greenhouse.io/<slug>/jobs/...   jobs.lever.co/<slug>/...
#   jobs.ashbyhq.com/<slug>/...                jobs.smartrecruiters.com/<slug>/...
#   apply.workable.com/<slug>/...
#
# Run `npm run verify` (or `docker compose run --rm job-finder verify`) after editing:
# it checks every board and tells you which slugs are wrong.
# Set `enabled: false` to pause one without deleting it.

companies:
